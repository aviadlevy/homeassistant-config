- id: night_environment_routine
  alias: Night environment routine
  description: Controls night/morning environment - turns on kids plug and quiets
    vacuum at 18:30, reverses in the morning based on schedule/vacation/Shabbat
  triggers:
  - at: '18:30:00'
    id: 'on'
    trigger: time
  - id: 'off'
    value_template: '{% if states(''binary_sensor.is_school_vacation'') == ''on''  or
      (is_state(''input_boolean.delay_morning_routine'' ,''on'')) %}

      {{ now() >= today_at(states(''input_datetime.morning_routine_baseline'')) +
      timedelta(minutes = (states(''input_number.morning_vacation_delay'')| int))
      }}

      {% elif states(''input_select.mode'') == ''Shabbat'' %}

      {{ now() >= today_at(states(''input_datetime.shabbat_morning_lights_on'')) -
      timedelta(minutes = 30) }}

      {% else %}

      {{ now() >= today_at(states(''input_datetime.morning_routine_baseline'')) }}

      {% endif %}'
    trigger: template
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: input_select.mode
      state: Away
  actions:
  - if:
    - condition: trigger
      id:
      - 'on'
    then:
    - data: {}
      target:
        entity_id: switch.smart_plug_kids_bedroom
      action: switch.turn_on
    - action: number.set_value
      metadata: {}
      data:
        value: '10'
      target:
        entity_id: number.dreame_robot_vacuum_d9_volume
    - action: select.select_option
      metadata: {}
      data:
        option: quiet
      target:
        entity_id: select.dreame_robot_vacuum_d9_suction_level
    else:
    - data: {}
      target:
        entity_id: switch.smart_plug_kids_bedroom
      action: switch.turn_off
    - data: {}
      target:
        entity_id:
        - fan.kids_fan
      enabled: true
      action: fan.turn_off
    - data: {}
      target:
        entity_id: light.wled_backlight_tv
      action: light.turn_off
    - if:
      - condition: or
        conditions:
        - condition: state
          entity_id: binary_sensor.is_raining
          state: 'off'
      then:
      - data: {}
        target:
          entity_id: cover.switcher_runner
        action: cover.open_cover
      else:
      - target:
          entity_id:
          - cover.switcher_runner
        data:
          position: 19
        action: cover.set_cover_position
    - action: number.set_value
      metadata: {}
      data:
        value: '50'
      target:
        entity_id: number.dreame_robot_vacuum_d9_volume
    - action: select.select_option
      metadata: {}
      data:
        option: standard
      target:
        entity_id: select.dreame_robot_vacuum_d9_suction_level
  mode: single
- id: backlight_tv
  alias: Backlight TV
  description: Controls TV backlight WLED based on TV power state with Hyperion coordination
  triggers:
  - entity_id:
    - media_player.mitv
    to: 'on'
    id: turn_on
    for:
      hours: 0
      minutes: 0
      seconds: 5
    enabled: true
    trigger: state
  - entity_id:
    - media_player.mitv
    id: turn_off
    from: 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 5
    enabled: true
    trigger: state
  conditions: []
  actions:
  - delay:
      hours: 0
      minutes: 0
      seconds: 5
      milliseconds: 0
  - if:
    - condition: trigger
      id: turn_on
    - condition: not
      conditions:
      - condition: state
        entity_id: media_player.mitv_adb
        state: 'off'
    then:
    - condition: state
      entity_id: light.wled_backlight_tv
      state: 'off'
    - wait_for_trigger:
      - entity_id:
        - media_player.mitv_adb
        to: 'on'
        trigger: state
      timeout:
        hours: 0
        minutes: 0
        seconds: 10
        milliseconds: 0
    - data: {}
      target:
        entity_id: input_boolean.hyperion_activation
      action: input_boolean.turn_off
    - data:
        color_temp_kelvin: 3030
        brightness_pct: 50
        effect: Solid
        transition: 10
      target:
        entity_id: light.wled_backlight_tv
      action: light.turn_on
    else:
    - data: {}
      target:
        entity_id: input_boolean.hyperion_activation
      action: input_boolean.turn_off
    - delay:
        hours: 0
        minutes: 0
        seconds: 7
        milliseconds: 0
    - data:
        transition: 20
      target:
        entity_id: light.wled_backlight_tv
      action: light.turn_off
  mode: queued
  max: 10
- id: mode_changer_shabbat
  alias: Mode changer - Shabbat
  description: Turns Shabbos Mode ON/OFF depending on existing mode
  triggers:
  - trigger: time
    at: sensor.jewish_calendar_upcoming_havdalah
    id: 'off'
  - trigger: state
    entity_id:
    - binary_sensor.jewish_calendar_issur_melacha_in_effect
    from:
    - 'on'
    to:
    - 'off'
    id: 'off'
  - trigger: time
    at: sensor.jewish_calendar_upcoming_candle_lighting_calculated
    id: 'on'
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - 'on'
      - condition: state
        entity_id: input_select.mode
        state: Home
      sequence:
      - target:
          entity_id: input_select.mode
        data:
          option: Shabbat
        action: input_select.select_option
    - conditions:
      - condition: trigger
        id:
        - 'off'
      - condition: state
        entity_id: input_select.mode
        state: Shabbat
      sequence:
      - target:
          entity_id: input_select.mode
        data:
          option: Home
        action: input_select.select_option
      - data: {}
        target:
          entity_id:
          - input_boolean.guests
          - input_boolean.guests_shabbat_dinner
        action: input_boolean.turn_off
      - data: {}
        target:
          entity_id: input_boolean.delay_shabbat
        enabled: true
        action: input_boolean.turn_off
    default: []
  mode: single
- id: mode_changer_away
  alias: Mode changer - Away
  description: Turns Away Mode ON/OFF depending on existing mode
  triggers:
  - trigger: state
    entity_id: group.family
  condition: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{trigger.to_state.state == ''not_home''}}'
      - condition: state
        entity_id: input_select.mode
        state: Home
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.mode
        data:
          option: Away
    - conditions:
      - condition: template
        value_template: '{{trigger.to_state.state == ''home''}}'
      - condition: state
        entity_id: input_select.mode
        state: Away
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.mode
        data:
          option: Home
    default: []
  mode: single
- id: shabbat_5
  alias: Shabbat 6 - shabbat exists routine
  description: On mode change to shabbat mode, activate the scene and notify
  triggers:
  - entity_id:
    - input_select.mode
    from: Shabbat
    trigger: state
  conditions: []
  actions:
  - data: {}
    action: script.set_up_sonos_group
  - data:
      message: שבת יצאה. שבוע טוב לכולם
      chime_path: choir
      cache: true
      tts_platform: google_translate
      language: iw
      join_players: true
    target:
      entity_id:
      - media_player.sonos_kitchen
      - media_player.sonos_living_room
      - media_player.bedroom_echo_dot
    action: chime_tts.say
  - delay:
      hours: 0
      minutes: 0
      seconds: 10
      milliseconds: 0
  - data: {}
    target:
      entity_id:
      - media_player.sonos_living_room
      - media_player.sonos_kitchen
    action: media_player.unjoin
  - data:
      message: clear_notification
      data:
        tag: shabbat-mode
    action: notify.mobile_app_aviad_phone
  - metadata: {}
    data:
      volume_level: 0.25
    target:
      entity_id:
      - media_player.sonos_living_room
      - media_player.sonos_kitchen
    action: media_player.volume_set
  - metadata: {}
    data:
      addon: d5369777_music_assistant
    action: hassio.addon_start
  mode: single
- id: lights_out
  alias: Lights out
  description: Turns off all lights at 08:00/09:00, deactivates kids climate, and
    preserves bedroom fan state if room is occupied
  triggers:
  - at: 08:00:00
    trigger: time
  - at: 09:00:00
    trigger: time
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: input_select.mode
      enabled: true
      state: Shabbat
    - condition: state
      entity_id: binary_sensor.jewish_calendar_issur_melacha_in_effect
      state: 'on'
    - condition: state
      entity_id: person.noga
      state: home
  actions:
  - variables:
      current_bedroom_fan_state: '{{ states(''fan.bedroom_fan'') }}'
  - target:
      entity_id: scene.lights_out
    metadata: {}
    action: scene.turn_on
    data: {}
  - action: climate.turn_off
    metadata: {}
    target:
      entity_id: climate.kids_bedroom
    data: {}
  - if:
    - condition: state
      entity_id: binary_sensor.bedroom_occupancy_sensor_occupancy
      state: 'on'
    then:
    - metadata: {}
      data: {}
      target:
        entity_id: fan.bedroom_fan
      action: fan.turn_{{ current_bedroom_fan_state }}
  mode: single
- id: bed_md
  alias: Bed motion detection
  description: Turns on bed LED strip on motion at night when projector is off, turns
    off after motion stops
  triggers:
  - from: 'off'
    to: 'on'
    entity_id: binary_sensor.bed_motion_sensor
    trigger: state
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: input_select.mode
      state: Shabbat
    - condition: state
      entity_id: binary_sensor.jewish_calendar_issur_melacha_in_effect
      state: 'on'
  - condition: state
    entity_id: sun.sun
    state: below_horizon
  - condition: and
    conditions:
    - condition: or
      conditions:
      - condition: state
        entity_id: media_player.projector
        state: unavailable
      - condition: state
        entity_id: media_player.projector
        state: 'off'
    - condition: or
      conditions:
      - condition: state
        entity_id: remote.mibox3
        state: unavailable
      - condition: state
        entity_id: remote.mibox3
        state: 'off'
  actions:
  - data: {}
    target:
      entity_id: light.bed_led_strip
    action: light.turn_on
  - wait_for_trigger:
    - from: 'on'
      to: 'off'
      entity_id: binary_sensor.bed_motion_sensor
      trigger: state
    timeout:
      hours: 0
      minutes: 5
      seconds: 0
      milliseconds: 0
  - delay:
      hours: 0
      minutes: 0
      seconds: 40
      milliseconds: 0
  - data: {}
    target:
      entity_id: light.bed_led_strip
    action: light.turn_off
  mode: restart
- id: light_on_door
  alias: Lights on when opening door
  description: Saves kitchen light state, turns on entrance lights when door opens,
    restores after door closes
  triggers:
  - entity_id:
    - binary_sensor.door_sensor
    to: 'on'
    trigger: state
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: input_select.mode
      state: Shabbat
    - condition: state
      entity_id: binary_sensor.jewish_calendar_issur_melacha_in_effect
      state: 'on'
  - condition: or
    conditions:
    - condition: state
      state: below_horizon
      entity_id: sun.sun
    - condition: numeric_state
      entity_id: cover.switcher_runner
      below: 10
      attribute: current_position
  actions:
  - action: scene.create
    metadata: {}
    data:
      scene_id: before_door
      snapshot_entities:
      - light.wled_kitchen
  - data:
      effect: solid
      brightness_pct: 75
      color_temp_kelvin: 5390
    target:
      entity_id:
      - light.entrance_light
      - light.wled_kitchen
    action: light.turn_on
  - continue_on_error: true
    data:
      color_temp_kelvin: 2070
    target:
      entity_id:
      - light.small_kids_bedroom
      - light.bathroom_bulb
    action: light.turn_on
  - action: script.closet_light_flash
    metadata: {}
    data: {}
  - if:
    - condition: door.is_open
      target:
        entity_id: binary_sensor.door_sensor
      options:
        for: 00:00:00
    then:
    - wait_for_trigger:
      - entity_id:
        - binary_sensor.door_sensor
        trigger: state
        to: 'off'
        for:
          hours: 0
          minutes: 0
          seconds: 5
      timeout:
        hours: 0
        minutes: 2
        seconds: 0
        milliseconds: 0
  - delay:
      hours: 0
      minutes: 0
      seconds: 30
      milliseconds: 0
  - data: {}
    target:
      entity_id:
      - light.entrance_light
    action: light.turn_off
  - action: scene.turn_on
    metadata: {}
    data: {}
    target:
      entity_id: scene.before_door
  - action: scene.delete
    metadata: {}
    data: {}
    target:
      entity_id: scene.before_door
  mode: single
- id: shabbat_1
  alias: Shabbat 1 - candle light plag
  description: Announces candle lighting time at plag hamincha during early Shabbat
  triggers:
  - value_template: '{{ as_timestamp(states(''sensor.jewish_calendar_plag_hamincha''))|timestamp_custom(''%H:%M'',
      true) == as_timestamp(now())|timestamp_custom(''%H:%M'', true) }}'
    trigger: template
  conditions:
  - condition: state
    entity_id: input_select.mode
    state: Shabbat
  - condition: state
    entity_id: binary_sensor.is_early_shabbat
    state: 'on'
  - condition: not
    conditions:
    - condition: time
      weekday:
      - sat
  actions:
  - data:
      message: זמן הדלקת נרות
      chime_path: choir
      cache: true
      tts_platform: google_translate
      language: iw
      join_players: true
    target:
      entity_id:
      - media_player.sonos_kitchen
      - media_player.sonos_living_room
      - media_player.bedroom_echo_dot
    action: chime_tts.say
  mode: single
- id: alert_high_temp
  alias: Alert when high temperature
  description: Sends mobile notification when processor temperature exceeds 67C for
    10 minutes
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.processor_temperature
    for:
      hours: 0
      minutes: 10
      seconds: 0
    above: 67
  condition: []
  actions:
  - action: notify.mobile_app_aviad_phone
    data:
      message: Temperature is {{ states("sensor.processor_temperature") }}
      title: Temperature is too high
  mode: single
- id: alert_omer
  alias: Alert when Sfirat HaOmer
  description: Announces Sfirat HaOmer count via Telegram and Sonos speakers after
    the day changes
  triggers:
  - entity_id:
    - sensor.jewish_calendar_day_of_the_omer
    for:
      hours: 0
      minutes: 36
      seconds: 0
    trigger: state
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: sensor.jewish_calendar_day_of_the_omer
      state: '0'
  - condition: not
    conditions:
    - condition: template
      value_template: '{{trigger.from_state.state == ''unknown''}}'
  actions:
  - variables:
      message: '{% set totalDays = states(''sensor.jewish_calendar_day_of_the_omer'')
        | int %}{% set weeks = totalDays // 7 %}{% set daysInWeek = totalDays %7 %}{%
        set lsb = totalDays % 10 %}{% set msb = totalDays - lsb %}הַיּוֹם{% if totalDays
        == 1 %} יוֹם אֶחָד{% elif totalDays > 1 and totalDays < 7 %}{{ totalDays }}
        יָמִים{% else %} {% if totalDays < 21 or lsb == 0 %}{{ totalDays }}{% else
        %}{{ lsb }} וְ- {{ msb }}{% endif %} {% if totalDays < 11 %} יָמִים {% else
        %} יוֹם {% endif %} {% if weeks < 2 %}שֶׁהֵם שָׁבוּעַ אֶחָד {% else %}שֶׁהֵם
        {{ weeks }} שָׁבוּעוֹת {% endif %} {% if daysInWeek == 1 %}וְיוֹם אֶחָד {%
        elif daysInWeek > 1 %}וְ- {{ daysInWeek }} יָמִים {% endif %}{% endif %}לָעומֶר

        '
    enabled: false
  - action: jewish_calendar.count_omer
    data:
      nusach: sfarad
    response_variable: omer
    enabled: true
  - action: telegram_bot.send_message
    metadata: {}
    data:
      entity_id:
      - notify.telegram_bot_5918433747_4738468398
      message: '{{ omer[''message''] }}

        '
  - data:
      chime_path: toast
      offset: 1000
      announce: true
      language: iw
      tts_platform: google_translate
      cache: true
      message: '{{ omer[''message''] | replace(''לעומר'',''לה-עומר'') }}'
    target:
      entity_id: media_player.sonos_living_room
    enabled: true
    action: chime_tts.say
  mode: single
- id: alert_washing_machine_finished
  alias: Fire event when washing machine finished
  description: Detects washing machine completion by monitoring power drop, then fires
    washing_machine_finished event
  triggers:
  - entity_id: sensor.washing_machine_socket_power
    for:
      minutes: 5
    above: 5
    trigger: numeric_state
  - trigger: homeassistant
    event: start
  conditions:
  - condition: numeric_state
    entity_id: sensor.washing_machine_socket_power
    above: 5
  actions:
  - wait_for_trigger:
    - entity_id: sensor.washing_machine_socket_power
      below: 3
      for:
        minutes: 4
      trigger: numeric_state
  - if:
    - condition: state
      entity_id: binary_sensor.washing_machine_contact_sensor
      state: 'off'
    then:
    - event: washing_machine_finished
      event_data: {}
  mode: single
  max_exceeded: silent
- id: alert_phone_low_battery_aviad
  alias: Alert when phone low battery - Aviad
  description: Repeatedly alerts Aviad about low phone battery every 20 minutes until
    charging, Shabbat, or battery recovers
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.aviad_phone_battery_level
    below: input_number.low_battery_level_aviad
  - trigger: state
    entity_id:
    - binary_sensor.aviad_phone_is_charging
    to: 'off'
    for:
      hours: 0
      minutes: 15
      seconds: 0
  conditions:
  - condition: state
    entity_id: sun.sun
    state: above_horizon
  - condition: not
    conditions:
    - condition: state
      entity_id: input_select.mode
      state: Shabbat
  - condition: state
    entity_id: binary_sensor.aviad_phone_is_charging
    state: 'off'
  - condition: numeric_state
    entity_id: sensor.aviad_phone_battery_level
    below: input_number.low_battery_level_aviad
  actions:
  - repeat:
      until:
      - condition: or
        conditions:
        - condition: state
          entity_id: binary_sensor.aviad_phone_is_charging
          state: 'on'
        - condition: state
          entity_id: input_select.mode
          state: Shabbat
        - condition: numeric_state
          entity_id: sensor.aviad_phone_battery_level
          above: input_number.low_battery_level_aviad
        - condition: state
          entity_id: binary_sensor.jewish_calendar_issur_melacha_in_effect
          state: 'on'
      sequence:
      - data:
          message: clear_notification
          data:
            tag: aviad_low_battery
        action: notify.mobile_app_aviad_phone
      - data:
          message: Low battery
          data:
            actions:
            - action: long_snooze_low_battery_notification
              title: Longer Snooze
            tag: aviad_low_battery
        action: notify.mobile_app_aviad_phone
      - delay:
          hours: 0
          minutes: 20
          seconds: 0
          milliseconds: 0
      - if:
        - condition: state
          entity_id: input_boolean.longer_low_battery_snooze
          state: 'on'
        then:
        - delay:
            hours: 0
            minutes: 40
            seconds: 0
            milliseconds: 0
        - data: {}
          target:
            entity_id: input_boolean.longer_low_battery_snooze
          action: input_boolean.turn_off
  mode: single
- id: alert_phone_low_battery_noga
  alias: Alert when phone low battery - Noga
  description: Alerts Noga when phone battery drops below 40% during daytime
  triggers:
  - trigger: numeric_state
    entity_id: sensor.noga_phone_battery_level
    below: 40
  conditions:
  - condition: state
    entity_id: sun.sun
    state: above_horizon
  - condition: not
    conditions:
    - condition: state
      entity_id: input_select.mode
      state: Shabbat
  - condition: state
    entity_id: binary_sensor.noga_phone_is_charging
    state: 'off'
  actions:
  - action: notify.mobile_app_noga_phone
    data:
      message: Low battery
  mode: single
- id: tag_scanned_parent_bathroom
  alias: Tag parent bathroom is scanned
  description: Toggles parent bathroom lights when NFC tag is scanned
  triggers:
  - trigger: tag
    tag_id: 17137ac4-9193-4ce7-a194-43126a8b63b9
  condition: []
  actions:
  - action: light.toggle
    data: {}
    target:
      entity_id: light.parents_bathroom_lights
  mode: single
- id: lights_washing_machine_finished
  alias: When washing machine finished
  description: Notifies and announces washing machine completion, turns balcony light
    blue, repeats until door opened or tag scanned
  triggers:
  - event_type: washing_machine_finished
    trigger: event
  conditions: []
  actions:
  - data:
      message: מכונת הכביסה סיימה
    action: notify.mobile_app_noga_phone
  - data:
      rgb_color:
      - 17
      - 0
      - 255
    target:
      entity_id: light.balcony_bulb
    action: light.turn_on
  - if:
    - condition: time
      before: 07:05:00
    then:
    - wait_for_trigger:
      - trigger: time
        at: 07:05:00
  - parallel:
    - repeat:
        until:
        - condition: or
          conditions:
          - condition: state
            entity_id: binary_sensor.washing_machine_contact_sensor
            state: 'on'
          - condition: state
            entity_id: input_boolean.washing_machine_tag_scanned
            state: 'on'
        sequence:
        - if:
          - condition: state
            entity_id: media_player.mitv_adb
            state: playing
          then:
          - data:
              message: מכונת הכביסה סיימה
            action: notify.mi_tv
          - target:
              entity_id: media_player.sonos_kitchen
            data:
              offset: 500
              announce: true
              language: iw
              message: מכונת הכביסה סיימה
              tts_platform: google_translate
              chime_path: chord
              cache: true
            enabled: true
            action: chime_tts.say
          else:
          - target:
              entity_id:
              - media_player.sonos_kitchen
              - media_player.sonos_living_room
            data:
              offset: 500
              announce: true
              language: iw
              message: מכונת הכביסה סיימה
              tts_platform: google_translate
              chime_path: chord
              join_players: true
              cache: true
              unjoin_players: true
            enabled: true
            action: chime_tts.say
        - delay:
