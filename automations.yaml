- id: '1730829192764'
  alias: Alert when Mini PC disconnected
  description: Alerts when Mini PC goes offline, offers fingerbot toggle to power
    on, clears on reconnect
  triggers:
  - entity_id:
    - binary_sensor.mini_pc
    to:
    - 'off'
    trigger: state
    id: minipc
    for:
      hours: 0
      minutes: 5
      seconds: 0
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - delay:
      hours: 0
      minutes: 5
      seconds: 0
      milliseconds: 0
  - if:
    - condition: state
      entity_id: binary_sensor.mini_pc
      state: 'off'
    then:
    - metadata: {}
      data:
        message: Mini PC disconnected
        data:
          actions:
          - action: finger_bot_toggle
            title: Turn on
          tag: mini-pc-disconnected
      action: notify.mobile_app_aviad_phone
    - wait_for_trigger:
      - event_type: mobile_app_notification_action
        event_data:
          tag: mini-pc-disconnected
        trigger: event
      - entity_id:
        - binary_sensor.mini_pc
        to: 'on'
        trigger: state
      timeout:
        hours: 1
        minutes: 0
        seconds: 0
        milliseconds: 0
    - if:
      - condition: template
        value_template: '{{ wait.trigger and wait.trigger.event and wait.trigger.event.data
          and wait.trigger.event.data.action == ''finger_bot_toggle'' }}'
      then:
      - target:
          entity_id: switch.mini_pc_fingerbot_switch
        data: {}
        action: switch.toggle
      - data:
          message: clear_notification
          data:
            tag: mini-pc-disconnected
        action: notify.mobile_app_aviad_phone
      else:
      - data:
          message: clear_notification
          data:
            tag: mini-pc-disconnected
        action: notify.mobile_app_aviad_phone
