- id: echo_volume_routine
  alias: Projector in bedroom routine
  description: Adjusts Alexa volume and turns off bedroom lights when projector turns
    on, restores volume when off
  triggers:
  - entity_id:
    - remote.mibox3
    id: 'on'
    for:
      hours: 0
      minutes: 0
      seconds: 0
    to: 'on'
    trigger: state
  - entity_id:
    - remote.mibox3
    id: 'off'
    for:
      hours: 0
      minutes: 0
      seconds: 0
    enabled: true
    to: 'off'
    from: 'on'
    trigger: state
  conditions: []
  actions:
  - if:
    - condition: trigger
      id:
      - 'off'
    then:
    - action: alexa_devices.send_text_command
      metadata: {}
      data:
        text_command: Set volume to 3
        device_id: c34d2d172af44898c854fa792f0239e7
    else:
    - action: alexa_devices.send_text_command
      metadata: {}
      data:
        text_command: Set volume to max
        device_id: c34d2d172af44898c854fa792f0239e7
    - target:
        entity_id: media_player.mibox
      data:
        volume_level: 0.6
      action: media_player.volume_set
    - metadata: {}
      data: {}
      target:
        entity_id:
        - light.bed_led_strip
        - light.parent_bathroom_bulb
        - light.closet_bulb
        - light.bedroom_light
      action: light.turn_off
  mode: single
- id: home_wifi_routine
  alias: Home WIFI connection routine
  description: Publishes MQTT home/not_home location based on phone WiFi connection
    to home network
  triggers:
  - entity_id:
    - sensor.aviad_phone_wi_fi_connection
    trigger: state
  conditions: []
  actions:
  - delay:
      hours: 0
      minutes: 0
      seconds: 15
      milliseconds: 0
  - data:
      message: command_broadcast_intent
      data:
        intent_package_name: com.tailscale.ipn
        intent_action: com.tailscale.ipn.{{ "DIS" if "Levy" in states('sensor.aviad_phone_wi_fi_connection')  else
          ""}}CONNECT_VPN
    enabled: false
    action: notify.mobile_app_aviad_phone
  - if:
    - condition: template
      value_template: '{{ states(''sensor.aviad_phone_wi_fi_connection'') in ["Levy",
        "Levy_5G", "Levy_EXT"] }}'
    then:
    - metadata: {}
      data:
        topic: location/aviad_wifi
        payload: home
        retain: true
      action: mqtt.publish
    else:
    - metadata: {}
      data:
        topic: location/aviad_wifi
        payload: not_home
        retain: true
      action: mqtt.publish
  mode: restart
- id: shabbat_1_1
  alias: Shabbat 1.1 - Kriat Shma when early shabbat
  description: Reminds to repeat Kriat Shma at Tzet HaKochavim during early Shabbat
  triggers:
  - value_template: '{{ as_timestamp(states(''sensor.jewish_calendar_t_set_hakochavim''))|timestamp_custom(''%H:%M'',
      true) == as_timestamp(now())|timestamp_custom(''%H:%M'', true) }}'
    trigger: template
  conditions:
  - condition: state
    entity_id: input_select.mode
    state: Shabbat
  - condition: state
    entity_id: binary_sensor.is_early_shabbat
    state: 'on'
  - condition: not
    conditions:
    - condition: time
      weekday:
      - sat
  actions:
  - data:
      chime_path: choir
      cache: true
      tts_platform: google_translate
      language: iw
      join_players: true
      message: לא לשכוח לחזור על קריאת שמע
    target:
      entity_id:
      - media_player.sonos_kitchen
      - media_player.sonos_living_room
    action: chime_tts.say
  mode: single
- id: shabbat_1_2
  alias: Shabbat 1.2 - wake up
  description: Announces the current time 3 times with 15-minute intervals on Shabbat
    for wake-up
  triggers:
  - at: input_datetime.shabbat_morning_lights_on
    trigger: time
  - trigger: time
    at: '14:00:00'
  - trigger: time
    at: '16:00:00'
  conditions:
  - condition: state
    entity_id: input_select.mode
    state: Shabbat
  actions:
  - repeat:
      count: 3
      sequence:
      - metadata: {}
        data: {}
        action: script.echo_say_the_time
      - delay:
          hours: 0
          minutes: 15
          seconds: 0
          milliseconds: 0
  mode: single
- id: '1716104348579'
  alias: Kids in school routine
  description: Controls bathroom light and shutter position based on school hours
    on weekdays
  triggers:
  - at: 08:30:00
    id: 'off'
    trigger: time
  - at: '12:30:00'
    id: 'on'
    trigger: time
  - trigger: state
    entity_id:
    - input_select.mode
    to: Home
    id: 'on'
  conditions:
  - condition: state
    entity_id: binary_sensor.is_school_vacation
    state: 'off'
  - condition: state
    entity_id: input_select.mode
    state: Home
  - condition: time
    weekday:
    - sun
    - mon
    - tue
    - wed
    - thu
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: trigger
        id:
        - 'on'
      - condition: time
        after: '12:00:00'
    - condition: trigger
      id:
      - 'off'
  actions:
  - target:
      entity_id: light.bathroom_bulb
    action: light.turn_{{ trigger.id }}
  - if:
    - condition: trigger
      id:
      - 'off'
    - condition: state
      entity_id: binary_sensor.is_raining
      state: 'off'
    - condition: state
      entity_id: binary_sensor.is_dst
      state: 'on'
    then:
    - metadata: {}
      data:
        position: 35
      target:
        entity_id: cover.switcher_runner
      action: cover.set_cover_position
  mode: single
