- id: alert_and_speak_day_agenda
  alias: Alert and speak day agenda
  description: Generates AI morning briefing with weather, calendar, and Jewish calendar,
    announces on speakers and Telegram
  triggers:
  - value_template: '{% if states(''binary_sensor.is_school_vacation'') == ''on''  or
      (is_state(''input_boolean.delay_morning_routine'' ,''on'')) %}

      {{ now() >= today_at(states(''input_datetime.morning_routine_baseline''))  +
      timedelta(minutes = 15) + timedelta(minutes = (states(''input_number.morning_vacation_delay'')|
      int)) }}

      {% else %}

      {{ now() >= today_at(states(''input_datetime.morning_routine_baseline''))  +
      timedelta(minutes = 15) }}

      {% endif %}'
    trigger: template
  conditions:
  - condition: state
    entity_id: input_select.mode
    state: Home
  actions:
  - data: {}
    enabled: true
    action: script.set_up_sonos_group
    continue_on_error: true
  - metadata: {}
    data:
      duration:
        hours: 17
        minutes: 0
        seconds: 0
    target:
      entity_id:
      - calendar.family
    response_variable: agenda
    action: calendar.get_events
  - action: jewish_calendar.count_omer
    metadata: {}
    data:
      nusach: sfarad
      language: he
      after_sunset: false
    response_variable: omer
    enabled: true
  - variables:
      time_and_weather: "Location: Petah Tikva, Israel (coastal plain)  \nTime: {{
        as_timestamp(now()) | timestamp_custom(\"%A %d/%m/%y %H:%M\") }} \n{% set
        max_temp = state_attr('sensor.ims_forecast_today', 'maximum_temperature')
        %}  \nWeather: {{ state_attr('sensor.ims_forecast_today', 'weather').value
        }} (max of {{ max_temp.value}}{{max_temp.unit }}, {{ states('sensor.ims_precipitation_probability')}}%
        precipitation)     \n"
      calendar_events: "Family calendar events today: {%- if agenda['calendar.family'].events
        %}\n  {%- for event in agenda['calendar.family'].events %}\n  - Summary: {{
        event.summary }}\n    Start: {% if event.start is defined %}{{ as_timestamp(event.start)
        | timestamp_custom(\"%H:%M\") }}{% else %}All Day{% endif %}\n  {%- endfor
        %}\n{%- else %}\n  - No upcoming events.\n{%- endif %} \n"
      special_day_events: "Is it school day? ->  {{ states('binary_sensor.is_school_vacation')
        == 'off' }}   \nHebrew date to mention in message: '{{states('sensor.jewish_calendar_date').split()[:2]
        | join(\" \") }}'   \n{% if states('sensor.jewish_calendar_holiday') %}   \nJewish
        Holiday: '{{states('sensor.jewish_calendar_holiday')}}'  {% endif %}  \n{%
        if  omer and 'message' in omer and omer['message'] %} Counting of the Omer:
        {{ omer['message'] }}{% endif %}  \n"
      max_res_tokens: 1000
      general_instructions: "Generate text for a notification that will be  be heard
        in our house speakers. no emojis.    **IMPORTANT: Return ONLY the  final message
        in Hebrew. Do NOT describe your reasoning, plan, or thoughts. No explanations,
        no preambles. This is a hard requirement.**  \n- You are a helpful personal
        agent that generates text for the Levy family. your answer should always be
        in Hebrew language. Family members are: Dad, Mom, Yair, Ayala, Ori. in Hebrew
        spelled:  אַבָּא, אִמָּא, יָאִיר, אַיָּלָה, אוֹרִי    \n- Your answers are
        helpful, friendly, insightful and kids friendly.   \n- Your message should
        not be longer than {{ max_res_tokens }} tokens! this is a hard requirement!
        \   \n- Your answer should contain 3 paragraphs, and 1 short goodbye paragraph.
        \ \n"
      specific_instructions: "- Your messages help the user prepare for their day,
        for example:\n  - Making note of unusual weather for the location and time
        of year (but not mundane details like \"0% chance of precipitation\")\n  -
        Anything that may be special or unique, such as celebrating a birthday\n\n-
        Your priority so everything can be in that message is:\n  - Weather forcast,
        but ignore if temperature is 0. it means something went wrong\n  - Upcoming
        calendar events\n  - adding a joke or an insightful thing or a meaningful
        event from history\n"
      ai_request: '{{ time_and_weather }}

        {{ calendar_events }}

        {{ special_day_events }}

        {{ general_instructions }}

        {{ specific_instructions }}

        '
    alias: Define AI request
  - action: script.generate_ai_flash_content
    data:
      prompt_text: '{{ ai_request }}'
      fallback_response: בוקר טוב משפחת לוי! שיהיה לכם יום נעים מלא בחוויות טובות
      target_ai_task: ai_task.google_ai_task
    response_variable: ai_script_response
  - variables:
      ai_response: '{{ ai_script_response.content }}'
  - action: telegram_bot.send_message
    metadata: {}
    data:
      entity_id:
      - notify.telegram_bot_5918433747_4738468398
      message: '{{ ai_response }}'
      inline_keyboard: Suggest a song:/suggest_song
    enabled: true
  - action: nakdan.get_nikud
    metadata: {}
    data:
      genre: modern
      text: '{{ ai_response }}'
    response_variable: nikud_response
  - action: script.normalize_kids_names
    metadata: {}
    data:
      input_text: '{{nikud_response.nikud_text}}'
    response_variable: normalize_nikud_response
  - data:
      offset: 500
      message: '{{ normalize_nikud_response.content }}

        '
      final_delay: 0
      tts_platform: google_translate
      language: iw
      chime_path: choir
      join_players: true
      unjoin_players: true
    target:
      entity_id:
      - media_player.sonos_kitchen
      - media_player.sonos_living_room
    action: chime_tts.say
    enabled: true
  - alias: trigger AI Song Recommendation Automation
    event: suggest_a_song
    event_data: {}
    enabled: false
  - action: input_boolean.turn_off
    metadata: {}
    data: {}
    target:
      entity_id: input_boolean.delay_morning_routine
  mode: single
- id: oref_alert_time_to_shelter_countdown
  alias: Pikud HaOref routine
  description: Handles emergency alert - saves light/fan scene, adjusts to warm lighting,
    waits for all-clear, then restores
  triggers:
  - trigger: state
    entity_id:
    - sensor.oref_alert
    from:
    - pre_alert
    - ok
    to:
    - alert
  actions:
  - alias: Save current state if no snapshot exists
    if:
    - condition: template
      value_template: '{{ states.scene.before_alert == None }}'
      alias: Check if before_alert scene exists
    then:
    - action: scene.create
      metadata: {}
      data:
        scene_id: before_alert
        snapshot_entities:
        - light.wled_backlight_tv
        - light.entrance_light
        - light.wled_kitchen
        - fan.living_room_fan
        - light.mamad_small_socket_light
        - fan.mamad_fan
    enabled: true
  - alias: Set emergency warm lighting
    metadata: {}
    data:
      transition: 5
      brightness_pct: 30
      color_temp_kelvin: 3000
    target:
      entity_id:
      - light.wled_backlight_tv
      - light.wled_kitchen
      - light.entrance_light
      - light.mamad_small_socket_light
    action: light.turn_on
    continue_on_error: true
  - alias: Turn on Mamad fan
    action: fan.turn_on
    metadata: {}
    data: {}
    target:
      entity_id:
      - fan.mamad_fan
  - alias: Wait for alert to clear (max 2h)
    wait_for_trigger:
    - trigger: state
      entity_id:
      - sensor.oref_alert
      to:
      - ok
    timeout:
      hours: 2
      minutes: 0
      seconds: 0
      milliseconds: 0
  - alias: Check if all-clear received
    if:
    - alias: Previous wait for not timed out
      condition: template
      value_template: '{{ wait.trigger != none }}'
    then:
    - alias: 'Visual feedback: Green light in Mamad'
      action: light.turn_on
      metadata: {}
      data:
        rgb_color:
        - 0
        - 255
        - 0
      target:
        entity_id: light.mamad_small_socket_light
    - alias: 'TTS Announcement: All clear'
      data:
        message: אפשר לצאת מהממ"ד
        chime_path: bells
        cache: true
        announce: true
        language: iw
        tts_platform: google_translate
        end_chime_path: bells
        offset: 1000
        final_delay: 1000
        volume_level: '{{ 0.6 if now().hour < 19 and now().hour > 6 else 0.3 }}'
      action: chime_tts.say
      enabled: true
      target:
        entity_id:
        - media_player.sonos_living_room
  - alias: Wait 30s before adjusting lights
    delay:
      hours: 0
      minutes: 0
      seconds: 30
      milliseconds: 0
  - alias: Set Mamad light to post-alert brightness
    metadata: {}
    data:
      transition: 5
      brightness_pct: 60
      color_temp_kelvin: 2330
    target:
      entity_id:
      - light.mamad_small_socket_light
    action: light.turn_on
    continue_on_error: true
  - alias: Wait 4.5m for final restoration
    delay:
      hours: 0
      minutes: 4
      seconds: 30
      milliseconds: 0
  - alias: Restore previous state
    action: scene.turn_on
    metadata: {}
    data: {}
    target:
      entity_id: scene.before_alert
  - alias: 'Cleanup: Delete snapshot scene'
    action: scene.delete
    metadata: {}
    data: {}
    target:
      entity_id: scene.before_alert
  mode: restart
