        רבה" %}  שמחת תורה {% elif state_attr(''sensor.jewish_calendar_holiday'',
        ''type'') in [''EREV_YOM_TOV'', ''YOM_TOV''] %} {{ states(''sensor.jewish_calendar_holiday'')
        | replace(''ערב '', '''') }} {% else %} שבת {% endif %}

