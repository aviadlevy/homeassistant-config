      - light.kitchen_switch
      to: 'on'
    timeout:
      hours: 0
      minutes: 30
      seconds: 0
      milliseconds: 0
  - data:
      transition: 15
    action: light.turn_off
    target:
      entity_id: light.wled_kitchen
