- id: '1745775409890'
  alias: Pikud HaOref - pre-emptive alert
  description: Forwards Pikud HaOref update events as Telegram messages and speaker
    announcements during daytime. Special funny sound for pre_alert between 09:00-18:00.
  triggers:
  - trigger: state
    entity_id:
    - sensor.oref_alert
    from:
    - ok
    - pre_alert
    to: alert
  - trigger: state
    entity_id:
    - sensor.oref_alert
    from:
    - ok
    - alert
    to: pre_alert
  - trigger: state
    entity_id:
    - sensor.oref_alert
    from:
    - pre_alert
    - alert
    to: ok
  actions:
  - variables:
      title: עדכון מפיקוד העורף
      area: '{{ trigger.to_state.attributes.area }}'
      message: '{{ trigger.to_state.attributes.record.title }}'
      short_message: '{{ trigger.to_state.attributes.record.title | replace('' אוטומטית
        לאחר שחלף הזמן המקסימלי'', '''') }}'
      emoji: "{% set state = trigger.to_state.state %}\n{% if state == 'alert' %}
        \U0001F680\n{% elif state == 'pre_alert' %} ⚠️\n{% elif state == 'ok' %} ✅\n{%
        else %} \U0001F4E2 {% endif %}\n"
      color: '{% set state = trigger.to_state.state %}

        {% if state == ''alert'' %} red

        {% elif state == ''pre_alert'' %} yellow

        {% elif state == ''ok'' %} green

        {% else %} cyan {% endif %}

        '
  - action: telegram_bot.send_message
    data:
      entity_id: notify.telegram_bot_5918433747_4738468398
      message: '{{ message }}'
      title: '{{ emoji }} {{ title }} - {{ area }}'
  - if:
    - condition: and
      conditions:
      - condition: template
        value_template: '{{ trigger.to_state.state == ''pre_alert'' }}'
      - condition: time
        after: 09:00:00
        before: '18:00:00'
    then:
    - action: sonos.snapshot
      metadata: {}
      data:
        with_group: true
        entity_id: media_player.sonos_living_room
    - action: script.set_up_sonos_group_music_casting
      metadata: {}
      data: {}
    - action: media_player.play_media
      target:
        entity_id:
        - media_player.sonos_living_room
        - media_player.sonos_kitchen
      data:
        media:
          media_content_id: media-source://media_source/local/pre_alert_funny_short.mp3
          media_content_type: audio/mpeg
          metadata:
            title: pre_alert_funny_short.mp3
            thumbnail:
            media_class: music
            children_media_class:
            navigateIds:
            - {}
            - media_content_type: app
              media_content_id: media-source://media_source
            browse_entity_id: media_player.sonos_living_room
        announce: true
    - delay:
        hours: 0
        minutes: 1
        seconds: 15
        milliseconds: 0
    - action: sonos.restore
      metadata: {}
      data:
        with_group: true
        entity_id: media_player.sonos_living_room
    else:
    - alias: Conditional play on all speakers
      if:
      - condition: or
        conditions:
        - condition: time
          weekday:
          - sun
          - mon
          - tue
          - wed
          - thu
          - sat
          after: 07:00:00
          before: '19:30:00'
        - condition: template
          value_template: "{% set now_dt = now() %} {% set next_setting = state_attr('sun.sun',
            'next_setting') | as_datetime | as_local %} {% set t = next_setting +
            timedelta(hours = 1) %} {% if is_state('binary_sensor.is_early_shabbat'
            ,'off') %}\n  {% set t = t + timedelta(hours = 1) %}\n{% endif %} {% set
            baseline = today_at(states('input_datetime.shabbat_night_baseline_routine'))
            %} {% if t < baseline %} {% set t = baseline %} {% endif %} {% if is_state('input_boolean.guests_shabbat_dinner'
            ,'on') %}\n  {% set g_min_delay = states('input_number.guests_shabbat_dinner_delay')
            | int(0) %}\n  {% set t = t + timedelta(minutes = g_min_delay) %}\n{%
            endif %} {% set is_erev_hag = is_state('binary_sensor.jewish_calendar_erev_shabbat_hag',
            'on') %} {% set is_shabbat_mode = is_state('input_select.mode', 'Shabbat')
            %} {% set is_after_seven = now_dt >= today_at(\"07:00\") %} {{ is_after_seven
            and (is_erev_hag or (is_shabbat_mode and now_dt < t)) }}\n"
      then:
      - action: chime_tts.say
        target:
          entity_id:
          - media_player.sonos_living_room
          - media_player.sonos_kitchen
        data:
          chime_path: bells
          tts_platform: google_translate
          language: iw
          message: '{{ title }}: {{short_message }}'
          announce: true
          volume_level: '{{ 0.6 if now().hour < 17 else 0.4 }}'
          cache: true
  - alias: Conditional play on Bedroom
    if:
    - condition: and
      conditions:
      - condition: time
        after: 07:00:00
        before: input_datetime.shabbat_lights_out
      - condition: or
        conditions:
        - condition: state
          entity_id: input_select.mode
          state: Shabbat
        - condition: state
          entity_id: binary_sensor.bedroom_occupancy_sensor_occupancy
          state:
          - 'on'
          enabled: true
    then:
    - action: chime_tts.say
      target:
        entity_id: media_player.bedroom_echo_dot
      data:
        chime_path: bells
        tts_platform: google_translate
        language: iw
        message: '{{ title }} {{ short_message }}'
        cache: true
