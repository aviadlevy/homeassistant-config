- id: shabbat_2
  alias: Shabbat 2 - lights scenes
  description: Controls Shabbat lighting scenes throughout the day - evening, night,
    morning, meal, afternoon, and pre-sunset
  triggers:
  - event: sunset
    offset: '1:00:00'
    id: shabbat_1_evening_house
    trigger: sun
  - id: shabbat_2_night_house
    at: input_datetime.shabbat_lights_out
    trigger: time
  - at: input_datetime.shabbat_morning_lights_on
    id: shabbat_3_morning_house
    enabled: true
    trigger: time
  - at: '10:30:00'
    id: shabbat_3_morning_meal
    enabled: true
    trigger: time
  - at: input_datetime.shabbat_noon_lights_out
    id: shabbat_4_day_house
    enabled: true
    trigger: time
  - event: sunset
    offset: -01:30:00
    id: shabbat_5_sunset_house
    enabled: true
    trigger: sun
  conditions:
  - condition: state
    entity_id: input_select.mode
    state: Shabbat
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: shabbat_1_evening_house
      - condition: time
        after: 00:00:00
        before: input_datetime.shabbat_lights_out
      sequence:
      - if:
        - condition: state
          entity_id: binary_sensor.is_early_shabbat
          state: 'off'
        then:
        - delay:
            hours: 1
        else: []
      - if:
        - condition: time
          before: input_datetime.shabbat_night_baseline_routine
          after: 00:00:00
        then:
        - wait_for_trigger:
          - at: input_datetime.shabbat_night_baseline_routine
            trigger: time
        else: []
      - if:
        - condition: state
          entity_id: input_boolean.guests_shabbat_dinner
          state: 'on'
        then:
        - delay: '{{ states(''input_number.guests_shabbat_dinner_delay'') | multiply(60)
            | int }}'
        else: []
      - if:
        - condition: time
          after: 00:00:00
          before: input_datetime.shabbat_lights_out
        then:
        - action: scene.turn_on
          target:
            entity_id: scene.shabbat_1_evening
        - data: {}
          target:
            entity_id: light.bed_led_strip
          action: light.turn_on
    - conditions:
      - condition: trigger
        id: shabbat_2_night_house
      sequence:
      - target:
          entity_id: cover.switcher_runner
        data:
          position: 9
        action: cover.set_cover_position
      - action: scene.turn_on
        target:
          entity_id: scene.shabbat_2_goodnight
    - conditions:
      - condition: trigger
        id: shabbat_3_morning_house
      sequence:
      - if:
        - condition: or
          conditions:
          - condition: numeric_state
            entity_id: sensor.average_cloudiness_1h
            above: 60
          - condition: numeric_state
            entity_id: sensor.pirateweather_cloud_coverage
            above: 60
          - condition: numeric_state
            entity_id: cover.switcher_runner
            attribute: current_position
            below: 20
        then:
        - target:
            entity_id: scene.shabbat_3_morning_cloudy
          metadata: {}
          action: scene.turn_on
        else:
        - target:
            entity_id: scene.shabbat_3_morning
          metadata: {}
          action: scene.turn_on
    - conditions:
      - condition: trigger
        id: shabbat_3_morning_meal
      sequence:
      - if:
        - condition: or
          conditions:
          - condition: numeric_state
            entity_id: sensor.average_cloudiness_1h
            above: 60
          - condition: numeric_state
            entity_id: sensor.pirateweather_cloud_coverage
            above: 60
          - condition: numeric_state
            entity_id: cover.switcher_runner
            attribute: current_position
            below: 20
        then:
        - target:
            entity_id: scene.shabbat_3_morning_cloudy
          metadata: {}
          action: scene.turn_on
    - conditions:
      - condition: trigger
        id: shabbat_4_day_house
      - condition: numeric_state
        entity_id: cover.switcher_runner
        attribute: current_position
        above: 20
      - condition: numeric_state
        entity_id: sensor.average_cloudiness_1h
        below: 60
      - condition: numeric_state
        entity_id: sensor.pirateweather_cloud_coverage
        below: 60
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.shabbat_2_goodnight
    - conditions:
      - condition: trigger
        id: shabbat_5_sunset_house
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.shabbat_0_sunset
    default: []
  mode: queued
  max: 10
