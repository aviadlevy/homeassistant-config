      config_entry_id: 01JZ6526B5R80Y7SC1WM9QM3FC
      file_id: '{{ trigger.event.data.file_id }}'
      file_name: telegram_sched.jpg
    response_variable: file_path
  - action: llmvision.image_analyzer
    metadata: {}
    data:
      store_in_timeline: false
      use_memory: false
      include_filename: false
      target_width: 1280
      max_tokens: 3000
      generate_title: false
      expose_images: false
      response_format: json
      description_field: description
      provider: 01KM8Z96X8HN4QYFR9YHBNF2Q3
      message: "Extract prayer times from the image into a JSON object. Pay strict
        attention to horizontal row alignment between the times on the left and the
        Hebrew text on the right.\n\n### 1. Strict Extraction Rules & Row Alignment\n*
        **\"shabbat\"**: Use times from the \"שבת\" section only.\n    * **shacharit**:
        Extract ONLY the time aligned with \"שחרית מניין ב'\" (Minyan B).\n    * **mincha**:
        Extract the time aligned with the exact word \"מנחה\". WARNING: Do NOT use
        the time for \"דף יומי\" which is directly above it.\n    * **maariv**: Extract
        ONLY the time aligned with \"צאת השבת, ערבית\". WARNING: Do NOT use the time
        for \"ערבית (חזון)\" which is directly above it.\n* **\"regular_day\"**: Use
        times from the \"במשך השבוע\" section only.\n    * **mincha**: Extract the
        time aligned with the exact word \"מנחה\". WARNING: Do NOT use the time for
        \"דף יומי\" which is directly above it.\n    * **maariv**: Extract ONLY the
        time aligned with \"ערבית א'\".\n* **Skip Entirely**: Erev Shabbat (ערב שבת),
        Daf Yomi (דף יומי), classes (שיעור), and Tehillim.\n\n### 2. Key Mapping\n*
        שחרית -> `\"shacharit\"`\n* מנחה גדולה -> `\"mincha_gedola\"`\n* מנחה -> `\"mincha\"`\n*
        ערבית -> `\"maariv\"`"
      image_file: '{{ file_path.file_path }}'
      title_field: title
      structure: "{\n  \"type\": \"object\",\n  \"properties\": {\n    \"shabbat\":
        {\n      \"type\": \"object\",\n      \"properties\": {\n        \"shacharit\":
        { \"type\": \"array\", \"items\": { \"type\": \"string\" } },\n        \"mincha_gedola\":
        { \"type\": \"array\", \"items\": { \"type\": \"string\" } },\n        \"mincha\":
        { \"type\": \"array\", \"items\": { \"type\": \"string\" } },\n        \"maariv\":
        { \"type\": \"array\", \"items\": { \"type\": \"string\" } }\n      },\n      \"required\":
        [\"shacharit\", \"mincha_gedola\", \"mincha\", \"maariv\"]\n    },\n    \"regular_day\":
        {\n      \"type\": \"object\",\n      \"properties\": {\n        \"mincha\":
        { \"type\": \"array\", \"items\": { \"type\": \"string\" } },\n        \"maariv\":
        { \"type\": \"array\", \"items\": { \"type\": \"string\" } }\n      },\n      \"required\":
        [\"mincha\", \"maariv\"]\n    }\n  },\n  \"required\": [\"shabbat\", \"regular_day\"]\n}"
    response_variable: llm_response
  - variables:
      sched: '{{ llm_response.structured_response }}'
      success_list: "{%- set ns = namespace(items=[]) -%} {%- set mapping = [\n  {'day':
        'shabbat', 'pray': 'shacharit', 'name': 'Shabbat Shacharit'},\n  {'day': 'shabbat',
        'pray': 'mincha_gedola', 'name': 'Shabbat Mincha Gedola'},\n  {'day': 'shabbat',
        'pray': 'mincha', 'name': 'Shabbat Mincha'},\n  {'day': 'shabbat', 'pray':
        'maariv', 'name': 'Shabbat Maariv'},\n  {'day': 'regular_day', 'pray': 'mincha',
        'name': 'Weekday Mincha'},\n  {'day': 'regular_day', 'pray': 'maariv', 'name':
        'Weekday Maariv'}\n] -%} {%- for item in mapping -%}\n  {%- if sched[item.day]
        is defined and sched[item.day][item.pray] is defined and sched[item.day][item.pray]
        | count > 0 -%}\n    {%- set ns.items = ns.items + [item.name ~ ': ' ~ sched[item.day][item.pray][0]]
        -%}\n  {%- endif -%}\n{%- endfor -%} {{ ns.items | join('\\n') }}"
  - repeat:
      for_each:
      - day: shabbat
        pray: shacharit
        entity: input_datetime.shabbat_shacharit
      - day: shabbat
        pray: mincha_gedola
        entity: input_datetime.shabbat_mincha_gedola
      - day: shabbat
        pray: mincha
        entity: input_datetime.shabbat_mincha
      - day: shabbat
        pray: maariv
        entity: input_datetime.shabbat_maariv
      - day: regular_day
        pray: mincha
        entity: input_datetime.regular_mincha
      - day: regular_day
        pray: maariv
        entity: input_datetime.regular_maariv
      sequence:
      - if:
        - condition: template
          value_template: "{{ sched[repeat.item.day] is defined and \n   sched[repeat.item.day][repeat.item.pray]
            is defined and \n   sched[repeat.item.day][repeat.item.pray] | count >
            0 }}"
        then:
        - target:
            entity_id: '{{ repeat.item.entity }}'
          data:
            time: '{{ sched[repeat.item.day][repeat.item.pray][0] }}:00'
          action: input_datetime.set_datetime
  - action: telegram_bot.send_message
    data:
      message: '{% if success_list | length > 0 %} ✅ **Updated Successfully:** {{
        success_list }} {% else %} ⚠️ **Warning:** No prayer times were found in the
        image. {% endif %}

        '
      chat_id: '{{ trigger.event.data.chat_id }}'
  mode: single
- id: '1777224988294'
  alias: Prayer Reminders
  description: Consolidated Shabbat TTS and Weekday Telegram reminders
  triggers:
  - trigger: time
    at:
      entity_id: input_datetime.shabbat_shacharit
      offset: -00:10:00
    id: שחרית_shabbat
  - trigger: time
    at:
      entity_id: input_datetime.shabbat_mincha_gedola
      offset: -00:10:00
    id: מנחה גדולה_shabbat
  - trigger: time
    at:
      entity_id: input_datetime.shabbat_mincha
      offset: -00:10:00
    id: מנחה_shabbat
  - trigger: time
    at:
      entity_id: sensor.jewish_calendar_upcoming_shabbat_havdalah
      offset: -00:20:00
    id: ערבית_shabbat
  - trigger: time
    at:
      entity_id: input_datetime.regular_mincha
      offset: -00:10:00
    id: מנחה_weekday
  - trigger: time
    at:
      entity_id: input_datetime.regular_maariv
      offset: -00:10:00
    id: ערבית_weekday
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id.endswith(''_shabbat'') }}'
      - condition: state
        entity_id: input_select.mode
        state:
        - Shabbat
        for:
          hours: 2
          minutes: 0
          seconds: 0
      sequence:
      - action: chime_tts.say
        target:
          entity_id:
          - media_player.sonos_kitchen
          - media_player.sonos_living_room
          - media_player.bedroom_echo_dot
        data:
          message: תזכורת, תפילת {{ trigger.id.split('_')[0] }} תתחיל בעוד עשר דקות
          chime_path: choir
          cache: true
          tts_platform: google_translate
          language: iw
          join_players: true
    - conditions:
      - condition: template
        value_template: '{{ trigger.id.endswith(''_weekday'') }}'
      - condition: not
        conditions:
        - condition: state
          entity_id: input_select.mode
          state: Shabbat
      - condition: template
        value_template: '{{ distance(''device_tracker.aviad_phone'', ''zone.home'')
          < 1.0 }}'
      sequence:
      - action: telegram_bot.send_message
        data:
          message: ⏰ **תזכורת:** תפילת {{ trigger.id.split('_')[0] }} בעוד 10 דקות.
          entity_id:
          - notify.telegram_bot_5918433747_191085358
  mode: parallel
- id: '1788699982328'
  alias: Mashov - homework, grades and behaviour - Combined
  description: Sends daily Mashov report with homework, behavior, and grades via Telegram
    and Chime TTS for all children
  triggers:
  - alias: Daily schedule - Sun -> Thu
    at: '16:00:00'
    trigger: time
    weekday:
    - sun
    - mon
    - tue
    - wed
    - thu
  - alias: Daily schedule - Fri
    at: '12:00:00'
    trigger: time
    weekday:
    - fri
  conditions:
  - condition: state
    entity_id: calendar.mashov_holidays_mashov_holidays_calendar
    state:
    - 'off'
  - condition: state
    entity_id: binary_sensor.is_school_vacation
    state:
    - 'off'
  actions:
  - repeat:
      for_each:
      - homework_sensor: sensor.mashov_yyr_lvy_g4_homework
        behavior_sensor: sensor.mashov_yyr_lvy_g4_behavior
        grades_sensor: sensor.mashov_yyr_lvy_g4_grades
      - homework_sensor: sensor.mashov_ylh_lvy_2_mashov_ylh_lvy_2_homework
        behavior_sensor: sensor.mashov_ylh_lvy_2_mashov_ylh_lvy_2_behavior
        grades_sensor: sensor.mashov_ylh_lvy_2_mashov_ylh_lvy_2_grades
      sequence:
      - variables:
          homework_sensor: '{{ repeat.item.homework_sensor }}'
          behavior_sensor: '{{ repeat.item.behavior_sensor }}'
          grades_sensor: '{{ repeat.item.grades_sensor }}'
          student_name: "{{ state_attr(behavior_sensor,'Student name')\n   or state_attr(homework_sensor,'Student
            name')\n   or state_attr(behavior_sensor,'student_name')\n   or state_attr(homework_sensor,'student_name')\n
            \  or 'התלמיד/ה' }}\n"
          todays_homework: "{% set items = state_attr(homework_sensor,'Items') or
            state_attr(homework_sensor,'items') or [] %} {% set today = now().date()
            %} {% set ns = namespace(lines=[]) %} {% for it in items %}\n  {% if it.lesson_date
            is defined and it.lesson_date %}\n    {% if as_datetime(it.lesson_date).date()
            == today %}\n      {% set subj = it.subject_name or it.subject or 'מקצוע'
            %}\n      {% set hw = (it.homework or it.remark or '') | replace('\\n','
            ') %}\n      {% set ns.lines = ns.lines + [subj ~ ': ' ~ hw] %}\n    {%
            endif %}\n  {% endif %}\n{% endfor %} {{ ns.lines | join(' ; ') }}\n"
          todays_behavior: "{% set items = state_attr(behavior_sensor,'Items') or
            state_attr(behavior_sensor,'items') or [] %} {% set today = now().date()
            %} {% set ns = namespace(lines=[]) %} {% for it in items %}\n  {% if it.lesson_date
            is defined and it.lesson_date %}\n    {% if as_datetime(it.lesson_date).date()
            == today %}\n      {% set subj = it.subject or 'מקצוע' %}\n      {% set
            tag = it.achva_name or it.event or 'אירוע' %}\n      {% if tag != 'נוכחות'
            %}\n        {% set ns.lines = ns.lines + [subj ~ ': ' ~ tag] %}\n      {%
            endif %}\n    {% endif %}\n  {% endif %}\n{% endfor %} {{ ns.lines | join('
            ; ') }}\n"
          todays_grades: "{% set items = state_attr(grades_sensor,'Items') or state_attr(grades_sensor,'items')
            or [] %} {% set today = now().date() %} {% set ns = namespace(lines=[])
            %} {% for it in items %}\n  {% if it.eventDate is defined and it.eventDate
            %}\n    {% if as_datetime(it.eventDate).date() == today %}\n      {% set
            subj = it.subjectName or it.subject or 'מקצוע' %}\n      {% set entry
            = \"{} ב{} ({}) - {}\".format(it.gradeType, subj, it.gradingEvent, it.rangeGrade)
            %}\n      {% set ns.lines = ns.lines + [entry] %}\n    {% endif %}\n  {%
            endif %}\n{% endfor %} {{ ns.lines | join(' ; ') }}\n"
          has_data_today: '{{ (todays_homework | trim | length > 0) or (todays_behavior
            | trim | length > 0) or (todays_grades | trim | length > 0) }}

            '
          announcement_text: "{% set ns = namespace(parts=['שלום ' ~ student_name])
            %} {% if todays_behavior | trim | length > 0 %}\n  {% set ns.parts = ns.parts
            + ['התנהגות היום: ' ~ todays_behavior] %}\n{% endif %} {% if todays_homework
            | trim | length > 0 %}\n  {% set ns.parts = ns.parts + ['שיעורי בית היום:
            ' ~ todays_homework] %}\n{% endif %} {% if todays_grades | trim | length
            > 0 %}\n  {% set ns.parts = ns.parts + ['ציונים: ' ~ todays_grades] %}\n{%
            endif %} {{ ns.parts | join('. ') }}\n"
      - if:
        - condition: template
          value_template: '{{ has_data_today }}'
        then:
        - action: telegram_bot.send_message
          data:
            entity_id:
            - notify.telegram_bot_5918433747_4738468398
            message: '{{ announcement_text }}'
        - action: script.normalize_kids_names
          data:
            input_text: '{{ announcement_text }}'
          response_variable: normalize_speech_text
        - action: chime_tts.say
          target:
            entity_id: media_player.living_room
          data:
            chime_path: airport
            message: '{{ normalize_speech_text.content }}'
            tts_platform: google_translate
            announce: true
            cache: true
            language: iw
        else:
        - action: telegram_bot.send_message
          data:
            entity_id:
            - notify.telegram_bot_5918433747_4738468398
            message: לא דווחו שיעורי בית במשוב היום ל {{ student_name }}
  mode: restart
- id: '1788700085537'
  alias: Mashov – Bag Reminder - Combined
  description: Runs daily at 17:00 (for tomorrow) and Fridays at 12:00 (for Sunday),
    sending bag reminders for all children
  triggers:
  - at: '18:00:00'
    trigger: time
    weekday:
    - sun
    - tue
    - wed
    - thu
  - at: '13:05:00'
    trigger: time
    weekday:
    - mon
  - at: '12:00:00'
    id: friday_run
    trigger: time
    weekday:
    - fri
  conditions:
  - condition: state
    entity_id: input_boolean.tomorrow_no_school
    state:
    - 'off'
  actions:
  - repeat:
      for_each:
      - timetable_sensor: sensor.mashov_yyr_lvy_g4_timetable
      - timetable_sensor: sensor.mashov_ylh_lvy_2_mashov_ylh_lvy_2_timetable
      sequence:
      - variables:
          timetable_sensor: '{{ repeat.item.timetable_sensor }}'
          student_name: '{{ state_attr(timetable_sensor, ''student_name'') or ''התלמיד/ה''
            }}'
          speech_text: "{# HA weekday: 0=Mon, 1=Tue, 2=Wed, 3=Thu, 4=Fri, 5=Sat, 6=Sun
            #} {% set current_weekday_ha = now().weekday() %}\n{# Conditional Offset:
            If Friday (4), offset by 2 days (to Sunday, HA 6). Otherwise 1 day. #}
            {% set days_offset = 2 if current_weekday_ha == 4 else 1 %}\n{# Target
            weekday in HA format #} {% set target_weekday_ha = (current_weekday_ha
            + days_offset) % 7 %} \n{# Convert HA weekday (0=Mon..6=Sun) to Mashov
            Day (1=Sun..7=Sat) #} {% set target_day_mashov = ((target_weekday_ha +
            1) % 7) + 1 %}\n{% set lessons = state_attr(timetable_sensor, 'items')
            %} {% set lessons_for_day = lessons\n  | selectattr('timeTable.day', 'eq',
            target_day_mashov)\n  | sort(attribute='timeTable.lesson')\n  | list\n%}\n{%
            if lessons_for_day | count > 0 %}\n  {% set ns = namespace(final_subjects=[],
            subject_counts={}) %}\n  \n  {% for lesson in lessons_for_day %}\n    {%
            set subject = lesson.groupDetails.subjectName %}\n    {% set current_subject
            = subject %}\n    \n    {% set count = ns.subject_counts.get(current_subject,
            0) + 1 %}\n    {% set ns.subject_counts = dict(ns.subject_counts, **{current_subject:
            count}) %}\n    \n    {# Replacement Logic for Mashov Day 2 (Monday) #}\n
            \   {% if target_day_mashov == 2 %}\n      {% if current_subject == 'מתמטיקה'
            %}\n        {% set current_subject = 'גיאומטריה' %}\n      {% endif %}\n
            \   {% endif %}\n\n    {% if current_subject not in ns.final_subjects
            %}\n      {% set ns.final_subjects = ns.final_subjects + [current_subject]
            %}\n    {% else %}\n      {% if target_day_mashov == 3 and subject ==
            'מדעים' and current_subject == 'הלכה' %}\n        {% if 'מדעים' in ns.final_subjects
            %}\n          {% set ns.final_subjects = ns.final_subjects + [current_subject]
            %}\n        {% endif %}\n      {% endif %}\n    {% endif %}\n  {% endfor
            %}\n  \n  מערכת השיעורים של {{student_name}}\n  {% if current_weekday_ha
            == 4 %}\n    היום יום שישי, מערכת השיעורים ליום ראשון היא: {{ ns.final_subjects
            | join(', ') }}\n  {% else %}\n    מערכת השיעורים למחר היא: {{ ns.final_subjects
            | join(', ') }}\n  {% endif %}\n  \n{% else %}\n  {% if current_weekday_ha
            == 4 %}\n    אין שיעורים ליום ראשון. שבת שלום!\n  {% else %}\n    אין
            שיעורים למחר. תהנה מההפסקה!\n  {% endif %}\n{% endif %}"
      - action: script.normalize_kids_names
        data:
          input_text: '{{ speech_text }}'
        response_variable: normalize_speech_text
      - action: telegram_bot.send_message
        data:
          message: '{{ speech_text }}'
          entity_id:
          - notify.telegram_bot_5918433747_4738468398
      - action: chime_tts.say
        target:
          entity_id: media_player.living_room
        data:
          chime_path: airport
          message: '{{ normalize_speech_text.content }}'
          tts_platform: google_translate
          announce: true
          cache: true
          language: iw
  mode: single
