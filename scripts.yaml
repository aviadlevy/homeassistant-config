generate_ai_flash_content:
  alias: Generate AI content with retry
  description: Generates AI content using a designated AI task entity with automatic
    fallback retry on failure.
  fields:
    prompt_text:
      selector:
        text:
      name: AI Prompt Text
      required: true
    target_ai_task:
      selector:
        entity:
          domain: ai_task
      name: Target AI Task
      required: true
      default: ai_task.google_ai_task
    fallback_response:
      selector:
        text:
      name: Fallback Response
      required: false
      default: ''
  sequence:
  - variables:
      agent: error
      fallback_response: '{{ fallback_response | default('''') }}'
      fallback_ai_task: "{% if target_ai_task == 'ai_task.google_ai_task_pro' %}\n
        \ ai_task.google_ai_task\n{% else %}\n  ai_task.google_ai_task_pro\n{% endif
        %}"
  - action: ai_task.generate_data
    data:
      instructions: '{{ prompt_text }}'
      task_name: Morning greeting
      entity_id: '{{ target_ai_task }}'
    response_variable: agent
    continue_on_error: true
  - if:
    - condition: template
      value_template: '{{ not agent or agent == ''error'' or agent.data is not defined
        }}'
    then:
    - action: ai_task.generate_data
      data:
        instructions: '{{ prompt_text }}'
        task_name: Morning greeting
        entity_id: '{{ fallback_ai_task }}'
      response_variable: agent
      continue_on_error: true
  - if:
    - condition: template
      value_template: '{{ not agent or agent == ''error'' or agent.data is not defined
        }}'
    then:
    - variables:
        ai_response:
          content: '{{ fallback_response if fallback_response != "" else "Unable to
            generate AI response" }}'
    - stop: Failed
      response_variable: ai_response
    else:
    - variables:
        ai_response:
          content: '{{ agent.data if agent.data is string else (agent.data.text |
            default(agent.data | string)) }}'
    - stop: Success
      response_variable: ai_response
  mode: single
closet_light_flash:
  sequence:
  - action: scene.create
    metadata: {}
    data:
      scene_id: closet_before
      snapshot_entities:
      - light.closet_bulb
  - action: light.turn_on
    target:
      entity_id: light.closet_bulb
    data:
      flash: short
      color_temp_kelvin: 2000
      brightness_pct: 4
  - delay:
      hours: 0
      minutes: 0
      seconds: 10
      milliseconds: 0
  - action: scene.turn_on
    metadata: {}
    target:
      entity_id: scene.closet_before
    data: {}
  - action: scene.delete
    metadata: {}
    target:
      entity_id: scene.closet_before
    data: {}
  alias: Closet Light Flash
  description: ''
normalize_kids_names:
  alias: Normalize kids names
  description: Takes input text and normalizes kids' names to include full Nikud while
    preserving all other original text and Nikud.
  fields:
    input_text:
      selector:
        text:
      name: Input Text
      required: true
  sequence:
  - variables:
      raw_text: '{{ input_text | default('''') }}'
      normalized_text: "{{ raw_text \n   | regex_replace(\"א[ְִֵֶַָֹֻּ]*י[ְִֵֶַָֹֻּ]*י?[ְִֵֶַָֹֻּ]*ל[ְִֵֶַָֹֻּ]*ה\",
        \"אַיָּלָה\") \n   | regex_replace(\"א[ְִֵֶַָֹֻּ]*ו[ְִֵֶַָֹֻּ]*ר[ְִֵֶַָֹֻּ]*י\",
        \"אוֹרִי\") \n   | regex_replace(\"י[ְִֵֶַָֹֻּ]*א[ְִֵֶַָֹֻּ]*י[ְִֵֶַָֹֻּ]*ר\",
        \"יָאִיר\") }}"
  - variables:
      normalized_response:
        content: '{{ normalized_text }}'
  - stop: Normalized successfully
    response_variable: normalized_response
  mode: single
